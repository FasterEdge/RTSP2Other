name: 'Docker 镜像构建'
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'          # 打 v0.1.0 等标签时自动构建并产出镜像
jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: '构建 Docker 镜像'
      run: |
        docker build -t rtsp2other .
    - name: '导出并上传镜像工件'
      run: |
        docker save rtsp2other | gzip > rtsp2other-image.tar.gz
    - uses: actions/upload-artifact@v4
      with:
        name: 'rtsp2other-docker-image-${{ github.ref_name }}'
        path: 'rtsp2other-image.tar.gz'
        if-no-files-found: 'warn'
        retention-days: 14